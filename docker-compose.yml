services:
  db:
    image: postgres:17-alpine
    container_name: tic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tic}
      POSTGRES_DB: ${POSTGRES_DB:-tic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tic-db-data:
